name: Apply Chain.Love security patch

on:
  push:
    branches:
      - automation/apply-chain-love-security

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean final branch
        uses: actions/checkout@v4
        with:
          ref: data/add-security-offers-final
          fetch-depth: 0

      - name: Decode and apply verified patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/chain-love-security.patch
          git apply --check /tmp/chain-love-security.patch
          git apply /tmp/chain-love-security.patch
          git diff --check

      - name: Commit final data patch
        shell: bash
        run: |
          git config user.name "Elite"
          git config user.email "53697836+plantrungnampl@users.noreply.github.com"
          git add references/providers/providers.csv references/offers/security.csv listings/specific-networks/ethereum/security.csv listings/specific-networks/arbitrum/security.csv listings/specific-networks/filecoin/security.csv listings/specific-networks/somnia/security.csv
          git commit -m "data: add Revoke.cash, Forta, and Hypernative security offers"
          git push origin HEAD:data/add-security-offers-final
