name: Apply Chain.Love security patch

on:
  push:
    branches:
      - automation/apply-chain-love-security

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean final branch
        uses: actions/checkout@v4
        with:
          ref: data/add-security-offers-final
          fetch-depth: 0

      - name: Insert and validate CSV rows
        shell: python
        run: |
          from pathlib import Path
          import csv
          import json

          def insert_after_slug(path_str, anchor_slug, new_slug, row):
              path = Path(path_str)
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              slugs = [line.split(',', 1)[0] for line in lines[1:]]
              if new_slug in slugs:
                  return
              matches = [i for i, line in enumerate(lines) if line.split(',', 1)[0] == anchor_slug]
              if len(matches) != 1:
                  raise SystemExit(f'{path}: anchor {anchor_slug!r} found {len(matches)} times')
              lines.insert(matches[0] + 1, row + '\n')
              path.write_text(''.join(lines), encoding='utf-8', newline='')

          changes = [
              ('references/providers/providers.csv', 'forge', 'forta', 'forta,Forta,,Decentralized threat detection network providing real-time blockchain monitoring and threat intelligence through detection bots.,https://www.forta.org/,https://docs.forta.network/,,,,,,,FALSE,'),
              ('references/providers/providers.csv', 'hyperlane', 'hypernative', 'hypernative,Hypernative,,"Web3 security platform providing real-time monitoring, risk detection, and automated response across onchain and offchain data.",https://www.hypernative.io/,,,,,,,,FALSE,'),
              ('references/providers/providers.csv', 'reth', 'revoke-cash', 'revoke-cash,Revoke.cash,,"Web3 security tool for inspecting, updating, and revoking token approvals to reduce wallet exposure to approval exploits.",https://revoke.cash/,https://revoke.cash/learn/faq,,RevokeCash/revoke.cash,,,,,FALSE,'),
              ('references/offers/security.csv', 'failsafe-penetration-testing', 'forta-general-plan', 'forta-general-plan,Forta,Forta General Plan,"[""[Docs](https://docs.forta.network/en/latest/introduction-to-subscription-tiers/)"",""[FAQ](https://docs.forta.network/en/latest/FAQs/)""]","[""Web3 Security"",""Threat Intelligence"",""Blockchain Monitoring"",""Detection Bots""]","Subscription plan providing access to 99%+ of Forta detection bots, unlimited API access, and alert notifications.",Dedicated,General,250 FORT/mo,FALSE,FALSE,Monitoring,API,EVM,"[""threat intelligence"",""security alerts"",""blocks"",""transactions""]",'),
              ('references/offers/security.csv', 'hevm', 'hypernative-platform', 'hypernative-platform,Hypernative,Hypernative Platform,"[""[Website](https://www.hypernative.io/products/hypernative-platform)""]","[""Web3 Security"",""Real-Time Monitoring"",""Threat Detection"",""Automated Response""]","Real-time monitoring, risk detection, and automated response platform covering onchain and offchain security risks.",Enterprise,,,FALSE,FALSE,Monitoring,"Web app, API, SDK",,"[""smart contracts"",""transaction events"",""governance proposals"",""wallet interactions"",""web applications"",""price feeds""]",'),
              ('references/offers/security.csv', 'quantstamp-audit', 'revoke-cash', 'revoke-cash,Revoke.cash,Revoke.cash,"[""[Website](https://revoke.cash/)"",""[FAQ](https://revoke.cash/learn/faq)""]","[""Web3 Security"",""Wallet Security"",""Token Approvals"",""Approval Management"",""Open Source""]","Security tool for inspecting, updating, and revoking token approvals to reduce exposure to approval exploits and malicious approvals.",Free,,,FALSE,FALSE,Security,Web app,EVM,"[""token approvals"",""permit signatures"",""wallet security""]",'),
              ('listings/specific-networks/ethereum/security.csv', 'ercx-standard', 'forta-general-plan', 'forta-general-plan,,!offer:forta-general-plan,,,,,,,,,,,,,'),
              ('listings/specific-networks/ethereum/security.csv', 'hevm', 'hypernative-platform', 'hypernative-platform,,!offer:hypernative-platform,,,,,,,,,,,,,'),
              ('listings/specific-networks/ethereum/security.csv', 'polyzoa', 'revoke-cash', 'revoke-cash,,!offer:revoke-cash,,,,,,,,,,,,,'),
              ('listings/specific-networks/arbitrum/security.csv', 'ercx-standard', 'forta-general-plan', 'forta-general-plan,,!offer:forta-general-plan,,,,,,,,,,,,,'),
              ('listings/specific-networks/arbitrum/security.csv', 'halmos', 'hypernative-platform', 'hypernative-platform,,!offer:hypernative-platform,,,,,,,,,,,,,'),
              ('listings/specific-networks/arbitrum/security.csv', 'polyzoa', 'revoke-cash', 'revoke-cash,,!offer:revoke-cash,,,,,,,,,,,,,'),
              ('listings/specific-networks/filecoin/security.csv', 'peckshield-audit', 'revoke-cash', 'revoke-cash,,!offer:revoke-cash,,,,,,,,,,,,,'),
              ('listings/specific-networks/somnia/security.csv', 'polyzoa', 'revoke-cash', 'revoke-cash,,!offer:revoke-cash,,,,,,,,,,,,,'),
          ]

          for args in changes:
              insert_after_slug(*args)

          changed_paths = sorted({c[0] for c in changes})
          for path_str in changed_paths:
              with open(path_str, newline='', encoding='utf-8') as f:
                  rows = list(csv.reader(f))
              expected = len(rows[0])
              for number, row in enumerate(rows[1:], start=2):
                  if len(row) != expected:
                      raise SystemExit(f'{path_str}:{number}: {len(row)} columns, expected {expected}')
              slugs = [row[0] for row in rows[1:]]
              if slugs != sorted(slugs):
                  raise SystemExit(f'{path_str}: slug order is not ascending')

          with open('references/providers/providers.csv', newline='', encoding='utf-8') as f:
              provider_names = {r['name'] for r in csv.DictReader(f)}
          for required in ('Forta', 'Hypernative', 'Revoke.cash'):
              if required not in provider_names:
                  raise SystemExit(f'missing provider: {required}')

          with open('references/offers/security.csv', newline='', encoding='utf-8') as f:
              offer_rows = {r['slug']: r for r in csv.DictReader(f)}
          for slug in ('forta-general-plan', 'hypernative-platform', 'revoke-cash'):
              row = offer_rows[slug]
              if row['provider'] not in provider_names:
                  raise SystemExit(f'{slug}: unresolved provider {row["provider"]}')
              for field in ('actionButtons', 'tag', 'coverage'):
                  value = row[field]
                  if value:
                      parsed = json.loads(value)
                      if not isinstance(parsed, list):
                          raise SystemExit(f'{slug}.{field}: expected JSON array')

          offer_slugs = set(offer_rows)
          for path_str in (
              'listings/specific-networks/ethereum/security.csv',
              'listings/specific-networks/arbitrum/security.csv',
              'listings/specific-networks/filecoin/security.csv',
              'listings/specific-networks/somnia/security.csv',
          ):
              with open(path_str, newline='', encoding='utf-8') as f:
                  for row in csv.DictReader(f):
                      ref = row.get('offer', '')
                      if ref.startswith('!offer:') and ref[len('!offer:'):] not in offer_slugs:
                          raise SystemExit(f'{path_str}: unresolved {ref}')

          print('CSV_PATCH_VALIDATION: PASS')

      - name: Diff hygiene
        shell: bash
        run: git diff --check

      - name: Commit final data patch
        shell: bash
        run: |
          git config user.name "Elite"
          git config user.email "53697836+plantrungnampl@users.noreply.github.com"
          git add references/providers/providers.csv references/offers/security.csv listings/specific-networks/ethereum/security.csv listings/specific-networks/arbitrum/security.csv listings/specific-networks/filecoin/security.csv listings/specific-networks/somnia/security.csv
          git commit -m "data: add Revoke.cash, Forta, and Hypernative security offers"
          git push origin HEAD:data/add-security-offers-final
