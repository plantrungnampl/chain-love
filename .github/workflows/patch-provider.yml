name: Temporary provider patch

on:
  push:
    branches:
      - data/add-revoke-forta-hypernative-security

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[provider-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/add-revoke-forta-hypernative-security
          fetch-depth: 0
      - name: Insert provider rows and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('references/providers/providers.csv')
          text = path.read_text(encoding='utf-8')
          insertions = [
              (
                  'forge,Forge,forge.png,"Build, test, and deploy tool for Solidity smart contracts, part of the Foundry toolkit, supporting fast compilation, fuzz testing, invariant testing, and deployment scripting via a command-line interface.","https://www.getfoundry.sh/forge",,,,,,,,FALSE,\n',
                  'forta,Forta,,Decentralized threat detection network providing real-time blockchain monitoring and threat intelligence through detection bots.,https://www.forta.org/,https://docs.forta.network/,,,,,,,FALSE,\n',
              ),
              (
                  'hyperlane,Hyperlane,hyperlane.png,"Permissionless interoperability framework enabling cross-chain messaging and asset transfers across 150+ blockchains including EVM, Solana, Cosmos, and custom VMs.","https://www.hyperlane.xyz/","https://docs.hyperlane.xyz/",hyperlane,hyperlane-xyz,,,,,FALSE,\n',
                  'hypernative,Hypernative,,"Web3 security platform providing real-time monitoring, risk detection, and automated response across onchain and offchain data.",https://www.hypernative.io/,,,,,,,,FALSE,\n',
              ),
              (
                  'reth,Reth,reth.png,"Secure, performant, and modular Ethereum execution client and blockchain SDK written in Rust, supporting layer 2 deployments and MEV applications.","https://reth.rs/","https://reth.rs/docs/",,paradigmxyz/reth,,paradigm_reth,,,FALSE,\n',
                  'revoke-cash,Revoke.cash,,"Web3 security tool for inspecting, updating, and revoking token approvals to reduce wallet exposure to approval exploits.",https://revoke.cash/,https://revoke.cash/learn/faq,,RevokeCash/revoke.cash,,,,,FALSE,\n',
              ),
          ]

          for anchor, row in insertions:
              if row in text:
                  continue
              if text.count(anchor) != 1:
                  raise SystemExit(f'anchor count for insertion is {text.count(anchor)}, expected 1')
              text = text.replace(anchor, anchor + row, 1)

          path.write_text(text, encoding='utf-8', newline='')
          Path('.github/workflows/patch-provider.yml').unlink()
      - name: Commit patched provider file
        run: |
          git config user.name "chain-love-bounty-bot"
          git config user.email "chain-love-bounty-bot@users.noreply.github.com"
          git add references/providers/providers.csv .github/workflows/patch-provider.yml
          git commit -m "chore: patch providers [provider-patched]"
          git push origin HEAD:data/add-revoke-forta-hypernative-security
